<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=https://www.insta-boost.ru/">
  <link rel="canonical" href="https://www.insta-boost.ru/">
  <title>InstaBoost</title>
  <script>
    const target = new URL("https://www.insta-boost.ru");
    target.pathname = window.location.pathname;
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.toString());
  </script>
</head>
<body>
  <p><a href="https://www.insta-boost.ru/">Перейти на InstaBoost</a></p>
</body>
</html>
